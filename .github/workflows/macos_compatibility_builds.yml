name: 🍎 macOS Compatibility Builds (Old SDK)
on:
  workflow_call:

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: 4.4
  SCONSFLAGS: verbose=yes warnings=extra module_text_server_fb_enabled=yes

jobs:
  build-macos-compatibility:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 12 (Old SDK)
            os: macos-12
            cache-name: macos-12-compat
            target: editor
            tests: false
            sconsflags: optimize=size use_volk=no deprecated=no minizip=yes openxr=false vulkan=false graphite=false disable_3d_physics=true disable_navigation=true module_msdfgen_enabled=false module_text_server_adv_enabled=false module_text_server_fb_enabled=true modules_enabled_by_default=true module_gdscript_enabled=true module_freetype_enabled=true module_minimp3_enabled=true module_svg_enabled=true module_jpg_enabled=true module_ogg_enabled=true module_regex_enabled=true module_zip_enabled=true module_godot_physics_2d_enabled=true
            bin: ./bin/godot.macos.editor.arm64
            
          - name: macOS 13 (Medium SDK)
            os: macos-13
            cache-name: macos-13-compat
            target: editor
            tests: false
            sconsflags: optimize=size use_volk=no deprecated=no minizip=yes openxr=false vulkan=false graphite=false disable_3d_physics=true disable_navigation=true module_msdfgen_enabled=false module_text_server_adv_enabled=false module_text_server_fb_enabled=true modules_enabled_by_default=true module_gdscript_enabled=true module_freetype_enabled=true module_minimp3_enabled=true module_svg_enabled=true module_jpg_enabled=true module_ogg_enabled=true module_regex_enabled=true module_zip_enabled=true module_godot_physics_2d_enabled=true
            bin: ./bin/godot.macos.editor.arm64

          - name: macOS 14 (Medium SDK)
            os: macos-14
            cache-name: macos-14-compat
            target: editor
            tests: false
            sconsflags: optimize=size use_volk=no deprecated=no minizip=yes openxr=false vulkan=false graphite=false disable_3d_physics=true disable_navigation=true module_msdfgen_enabled=false module_text_server_adv_enabled=false module_text_server_fb_enabled=true modules_enabled_by_default=true module_gdscript_enabled=true module_freetype_enabled=true module_minimp3_enabled=true module_svg_enabled=true module_jpg_enabled=true module_ogg_enabled=true module_regex_enabled=true module_zip_enabled=true module_godot_physics_2d_enabled=true
            bin: ./bin/godot.macos.editor.arm64

          - name: macOS 15 (Medium SDK)
            os: macos-15
            cache-name: macos-15-compat
            target: editor
            tests: false
            sconsflags: optimize=size use_volk=no deprecated=no minizip=yes openxr=false vulkan=false graphite=false disable_3d_physics=true disable_navigation=true module_msdfgen_enabled=false module_text_server_adv_enabled=false module_text_server_fb_enabled=true modules_enabled_by_default=true module_gdscript_enabled=true module_freetype_enabled=true module_minimp3_enabled=true module_svg_enabled=true module_jpg_enabled=true module_ogg_enabled=true module_regex_enabled=true module_zip_enabled=true module_godot_physics_2d_enabled=true
            bin: ./bin/godot.macos.editor.arm64

          - name: macOS latest (Medium SDK)
            os: macos-latest
            cache-name: macos-latest-compat
            target: editor
            tests: false
            sconsflags: optimize=size use_volk=no deprecated=no minizip=yes openxr=false vulkan=false graphite=false disable_3d_physics=true disable_navigation=true module_msdfgen_enabled=false module_text_server_adv_enabled=false module_text_server_fb_enabled=true modules_enabled_by_default=true module_gdscript_enabled=true module_freetype_enabled=true module_minimp3_enabled=true module_svg_enabled=true module_jpg_enabled=true module_ogg_enabled=true module_regex_enabled=true module_zip_enabled=true module_godot_physics_2d_enabled=true
            bin: ./bin/godot.macos.editor.arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode and check SDK version
        run: |
          echo "=== Available Xcode versions ==="
          ls -la /Applications/Xcode*.app/Contents/Developer 2>/dev/null || echo "No Xcode apps found"
          
          echo "=== Current developer directory ==="
          xcode-select -p
          
          echo "=== Try to find working Xcode ==="
          for xcode_path in /Applications/Xcode*.app/Contents/Developer; do
            if [ -d "$xcode_path" ]; then
              echo "Trying Xcode at: $xcode_path"
              sudo xcode-select -s "$xcode_path" 2>/dev/null || continue
              if xcrun --show-sdk-version 2>/dev/null; then
                echo "Successfully set up Xcode at: $xcode_path"
                break
              fi
            fi
          done
          
          echo "=== Final Xcode and SDK Information ==="
          xcode-select -p
          xcrun --show-sdk-version || echo "Failed to get SDK version"
          xcrun --show-sdk-path || echo "Failed to get SDK path"
          xcrun --sdk macosx --show-sdk-version || echo "Failed to get macOS SDK version"  
          xcrun --sdk macosx --show-sdk-path || echo "Failed to get macOS SDK path"
          
          echo "=== Available SDKs ==="
          xcodebuild -showsdks || echo "Failed to list SDKs"
          
          echo "=== Xcode version ==="
          xcodebuild -version || echo "Failed to get Xcode version"
          
          echo "=== Clang version ==="
          xcrun clang --version || echo "Failed to get Clang version"

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # Skip Vulkan SDK setup since we're disabling Vulkan
      
      - name: Compilation Test (arm64 only)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm64 ${{ matrix.sconsflags }}
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}
          scons-cache-limit: 0

      - name: Basic functionality test
        run: |
          if [ -f "${{ matrix.bin }}" ]; then
            echo "Build successful! Binary exists: ${{ matrix.bin }}"
            ${{ matrix.bin }} --version || echo "Version check failed but binary exists"
            ls -la bin/
          else
            echo "Build failed! Binary not found: ${{ matrix.bin }}"
            exit 1
          fi

      - name: Upload artifact on success
        if: success()
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

  sdk-compatibility-summary:
    needs: build-macos-compatibility
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## macOS SDK Compatibility Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-macos-compatibility.result }}" == "success" ]; then
            echo "✅ **SUCCESS**: Metal drivers compile successfully across different SDK versions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The code is compatible with multiple macOS SDK versions and should work on systems with different Xcode versions." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**: Metal drivers failed to compile with some SDK versions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The code may use newer Metal APIs that are not available in older SDKs." >> $GITHUB_STEP_SUMMARY
            echo "Please check the build logs and add appropriate compatibility checks." >> $GITHUB_STEP_SUMMARY
          fi