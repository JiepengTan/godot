name: 🚀 Android Release Build
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:

env:
  ENGINE_VERSION: 4.2.2.stable
  # SCons cache settings to ensure efficient cache utilization
  SCONS_CACHE: "${{github.workspace}}/.scons-cache/"
  SCONS_CACHE_LIMIT: "10000"
  GODOT_BASE_BRANCH: master

jobs:
  android-build:
    name: 🤖 Android Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # Set up shared cache for all Android architectures
      - name: Set up build cache
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/.scons-cache/
          # Do not use SHA in cache key to allow cache reuse across commits
          key: android-release-${{env.GODOT_BASE_BRANCH}}-${{github.ref}}
          restore-keys: |
            android-release-${{env.GODOT_BASE_BRANCH}}-
            android-release-

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # Build in specific order to maximize cache utilization
      # First build debug and release versions of the same architecture to reuse compilation cache

      # arm32 builds (debug first, then release)
      - name: Build Android 32-bit Debug Template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: platform=android target=template_debug arch=arm32
          platform: android
          target: template_debug

      - name: Build Android 32-bit Release Template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: platform=android target=template_release arch=arm32
          platform: android
          target: template_release

      # arm64 builds (debug first, then release)
      - name: Build Android 64-bit Debug Template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: platform=android target=template_debug arch=arm64
          platform: android
          target: template_debug

      - name: Build Android 64-bit Release Template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: platform=android target=template_release arch=arm64
          platform: android
          target: template_release

      - name: Create Android Source Package
        run: |
          cd platform/android/java
          ./gradlew generateGodotTemplates
          cd -
          cp platform/android/java/godot-lib/bin/release/*.aar bin/
          zip -j bin/android_source.zip platform/android/java/plugins/godot-plugin-firebase/godot-plugin.gdextension platform/android/java/library/src/**/*.java platform/android/java/lib/src/**/*.java platform/android/java/app/src/**/*.java platform/android/java/lib/src/main/AndroidManifest.xml

      # Build APK (only for distribution)
      - name: Build Android APK (arm64-v8a)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: platform=android target=editor arch=arm64 android_arch=arm64v8
          platform: android
          target: editor

      - name: Build Android APK (armeabi-v7a)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: platform=android target=editor arch=arm32 android_arch=armv7
          platform: android
          target: editor

      - name: Prepare Android files for release
        if: github.event_name == 'release'
        run: |
          mkdir -p release
          cp bin/android*.apk release/
          cp bin/android_source.zip release/
          zip -j release/android.zip release/*

      - name: Upload Android Build Results
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ inputs.version }}
          path: bin/android*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: release/android.zip
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
