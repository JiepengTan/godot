name: Build Godot
description: Build Godot with the provided options.
inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: "editor"
  tests:
    description: Unit tests.
    default: false
  platform:
    description: Target platform.
    required: false
  sconsflags:
    default: ""
  scons-cache:
    description: The scons cache path.
    default: "${{ github.workspace }}/.scons-cache/"
  scons-cache-limit:
    description: The scons cache size limit.
    # actions/cache has 10 GiB limit, and GitHub runners have a 14 GiB disk.
    # Limit to 7 GiB to avoid having the extracted cache fill the disk.
    default: 7168
runs:
  using: "composite"
  steps:
    - name: Scons Build
      shell: sh
      env:
          SCONSFLAGS: ${{ inputs.sconsflags }}
          SCONS_CACHE: ${{ inputs.scons-cache }}
          SCONS_CACHE_LIMIT: ${{ inputs.scons-cache-limit }}
      run: |
        echo "Building with flags:" platform=${{ inputs.platform }} target=${{ inputs.target }} tests=${{ inputs.tests }} ${{ env.SCONSFLAGS }}
        if [ "${{ inputs.target }}" != "editor" ]; then rm -rf editor; fi  # Ensure we don't include editor code.
        # 显示当前缓存状态
        echo "SCons cache location: $SCONS_CACHE"
        mkdir -p $SCONS_CACHE
        if [ -d "$SCONS_CACHE" ]; then
          echo "Cache directory exists. Content:"
          ls -la $SCONS_CACHE
          echo "Cache size: $(du -sh $SCONS_CACHE | cut -f1)"
        else
          echo "Cache directory does not exist yet"
        fi
        # 使用缓存进行构建
        echo "Running SCons with cache"
        scons platform=${{ inputs.platform }} target=${{ inputs.target }} tests=${{ inputs.tests }} ${{ env.SCONSFLAGS }} 
        echo "Build completed. New cache status:"
        ls -la $SCONS_CACHE
        echo "New cache size: $(du -sh $SCONS_CACHE | cut -f1)"
        ls -l bin/
